name: videoexplore

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videoexplore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videoexplore}
      POSTGRES_DB: ${POSTGRES_DB:-videoexplore}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videoexplore} -d ${POSTGRES_DB:-videoexplore}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://videoexplore:videoexplore@db:5432/videoexplore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VIDEO_DIR: /data/videos
      CACHE_DIR: /data/cache
      AUTOSCAN_ON_STARTUP: ${AUTOSCAN_ON_STARTUP:-false}
      SMB_MOUNTS_FILE: /config/smb.mounts
    volumes:
      - type: bind
        source: ${VIDEO_HOST_DIR:-./data/videos}
        target: /data/videos
        read_only: true
        bind:
          create_host_path: true
          propagation: rslave
      - ${CACHE_HOST_DIR:-./cache}:/data/cache
      - ./data/smb.mounts:/config/smb.mounts:ro
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # メタ取得・サムネイル生成などCPU処理
  worker-cpu:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    command: celery -A worker.celery_app worker -Q cpu -c 2 -l info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://videoexplore:videoexplore@db:5432/videoexplore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VIDEO_DIR: /data/videos
      CACHE_DIR: /data/cache
    volumes:
      - type: bind
        source: ${VIDEO_HOST_DIR:-./data/videos}
        target: /data/videos
        read_only: true
        bind:
          create_host_path: true
          propagation: rslave
      - ${CACHE_HOST_DIR:-./cache}:/data/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # SigLIP2 タグ解析などGPU処理
  worker-gpu:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        BASE_IMAGE: ${NGC_PYTORCH_IMAGE:-nvcr.io/nvidia/pytorch:25.09-py3}
    command: celery -A worker.celery_app worker -Q gpu -c 3 -l info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://videoexplore:videoexplore@db:5432/videoexplore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VIDEO_DIR: /data/videos
      CACHE_DIR: /data/cache
      EMBED_MODEL: ${EMBED_MODEL:-google/siglip2-base-patch16-256}
      TAG_THRESHOLD: ${TAG_THRESHOLD:-0.30}
      FRAMES_PER_VIDEO: ${FRAMES_PER_VIDEO:-12}
      VLM_ENABLED: ${VLM_ENABLED:-true}
      VLM_API_URL: ${VLM_API_URL:-http://host.docker.internal:8888/v1}
      VLM_MODEL: ${VLM_MODEL:-deepseek-v4-flash-vision-exp}
      HF_HOME: /data/cache/hf
      TOKENIZERS_PARALLELISM: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${VIDEO_HOST_DIR:-./data/videos}
        target: /data/videos
        read_only: true
        bind:
          create_host_path: true
          propagation: rslave
      - ${CACHE_HOST_DIR:-./cache}:/data/cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # VLM キャプション生成(vLLM への HTTP 呼び出しのみ。GPU 計算は vLLM 側)
  worker-vlm:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    command: celery -A worker.celery_app worker -Q vlm -c 4 -l info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://videoexplore:videoexplore@db:5432/videoexplore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VIDEO_DIR: /data/videos
      CACHE_DIR: /data/cache
      VLM_ENABLED: ${VLM_ENABLED:-true}
      VLM_API_URL: ${VLM_API_URL:-http://host.docker.internal:8888/v1}
      VLM_MODEL: ${VLM_MODEL:-GLM-5.3-Flash-EXL3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${VIDEO_HOST_DIR:-./data/videos}
        target: /data/videos
        read_only: true
        bind:
          create_host_path: true
          propagation: rslave
      - ${CACHE_HOST_DIR:-./cache}:/data/cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
    expose:
      - "3000"
    depends_on:
      - api
    restart: unless-stopped

  # ブラウザからの単一窓口(UI + API を同一オリジンで提供)
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
